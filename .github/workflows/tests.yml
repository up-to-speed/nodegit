on:
  push:
    branches:
      - master
      - backport/*
    tags:
      - v*.*.*
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to rebuild and republish; omit to run tests only
        required: false
        type: string

name: Testing

jobs:
  linux-tests:
    name: "Linux Tests"
    strategy:
      matrix:
        node: ${{ fromJSON(inputs.release_tag != '' && '[22]' || '[20, 22, 24]') }}
        arch: [x64, arm64]
      fail-fast: false
    runs-on: ${{ matrix.arch == 'x64' && 'ubuntu-22.04' || 'ubuntu-22.04-arm' }}
    steps:
      - name: Install Dependencies for Ubuntu
        run: sudo apt-get update && sudo apt-get install -y software-properties-common git build-essential clang libssl-dev libkrb5-dev libc++-dev wget zlib1g-dev

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Environment
        run: |
          set -e
          mkdir ~/.ssh_tests
          chmod 700 ~/.ssh_tests
          printf "%b" "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh_tests/config
          cat test/id_rsa.pub > ~/.ssh_tests/id_rsa.pub
          cat test/id_rsa.enc | base64 -d > ~/.ssh_tests/id_rsa
          chmod 600 ~/.ssh_tests/id_rsa*
          git config --global user.name "John Doe"
          git config --global user.email johndoe@example.com

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Install
        id: install
        run: npm install

      - name: Test
        if: inputs.release_tag == ''
        run: |
          set -e
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh_tests/id_rsa
          node utils/retry npm test

      - name: Package prebuild
        id: package
        if: always() && steps.install.outcome == 'success' && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' || github.event_name == 'workflow_dispatch') && matrix.node == 22
        run: |
          npm install -g @mapbox/node-pre-gyp
          node lifecycleScripts/clean
          mkdir -p build/prebuild/Release
          cp build/Release/bungit.node build/prebuild/Release/
          npm pkg set binary.module_path=./build/prebuild/Release/
          node-pre-gyp package --target_arch=${{ matrix.arch }}

      - name: Upload prebuild artifact
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-linux-${{ matrix.arch }}
          path: build/stage/**/*.tar.gz

  macos-tests:
    name: "macOS Tests"
    strategy:
      matrix:
        node: ${{ fromJSON(inputs.release_tag != '' && '[22]' || '[20, 22, 24]') }}
        arch: [x64, arm64]
      fail-fast: false
    runs-on: ${{ matrix.arch == 'x64' && 'macos-15-intel' || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Environment
        run: |
          mkdir ~/.ssh_tests
          chmod 700 ~/.ssh_tests
          printf "%b" "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh_tests/config
          cat test/id_rsa.pub > ~/.ssh_tests/id_rsa.pub
          cat test/id_rsa.enc | base64 -d > ~/.ssh_tests/id_rsa
          chmod 600 ~/.ssh_tests/id_rsa*
          git config --global user.name "John Doe"
          git config --global user.email johndoe@example.com

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Install
        id: install
        run: npm install

      - name: Test
        if: inputs.release_tag == ''
        run: |
          set -e
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh_tests/id_rsa
          node utils/retry npm test

      - name: Package prebuild
        id: package
        if: always() && steps.install.outcome == 'success' && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' || github.event_name == 'workflow_dispatch') && matrix.node == 22
        run: |
          npm install -g @mapbox/node-pre-gyp
          node lifecycleScripts/clean
          mkdir -p build/prebuild/Release
          cp build/Release/bungit.node build/prebuild/Release/
          npm pkg set binary.module_path=./build/prebuild/Release/
          node-pre-gyp package --target_arch=${{ matrix.arch }}

      - name: Upload prebuild artifact
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-macos-${{ matrix.arch }}
          path: build/stage/**/*.tar.gz

  windows-tests:
    name: Windows Tests
    strategy:
      matrix:
        node: ${{ fromJSON(inputs.release_tag != '' && '[22]' || '[20, 22, 24]') }}
        arch: [x64, arm64]
      fail-fast: false
    runs-on: windows-2022
    steps:
      - name: Setup Environment
        run: |
          git config --file C:\ProgramData\Git\config core.autocrlf input
          git config --system core.autocrlf input
          git config --global core.autocrlf input
          git config --global user.name "John Doe"
          git config --global user.email johndoe@example.com

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      # OpenSSL configures VC-WIN64A with assembly, which needs NASM. The
      # runner image does not ship it.
      - name: Install NASM
        if: matrix.arch != 'arm64'
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # Windows links the OpenSSL in vendor/openssl rather than node.exe's
      # (utils/usesBundledOpenSSL.js). Building it is by far the slowest part
      # of this job and depends only on the target arch and the build scripts;
      # a restored cache that does not match is discarded by the version stamp
      # acquireOpenSSL.mjs writes.
      - name: Cache bundled OpenSSL
        uses: actions/cache@v4
        with:
          path: vendor/openssl
          key: openssl-windows-${{ matrix.arch }}-${{ hashFiles('utils/acquireOpenSSL.mjs', 'utils/build-openssl.bat') }}

      - name: Install
        id: install
        env:
          npm_config_arch: ${{ matrix.arch }}
        run: npm install

      # The runtime this package exists for. Bun exports no OpenSSL, so an
      # addon that borrowed node.exe's would fail to load here.
      - name: Set up Bun
        if: matrix.arch != 'arm64'
        uses: oven-sh/setup-bun@v2

      - name: Verify the addon loads in Bun
        if: matrix.arch != 'arm64'
        run: bun -e "const bungit = require('./lib/bungit.js'); if (typeof bungit.Repository !== 'function') { throw new Error('bungit loaded without its API'); }"

      - name: Test
        # need arm64 runners or an emulator to run tests
        if: inputs.release_tag == '' && matrix.arch != 'arm64'
        env:
          GIT_SSH: ${{ github.workspace }}\vendor\plink.exe
        run: |
          $encodedKey = Get-Content -Path test\private.ppk.enc
          $finalPath = Join-Path -Path $HOME -ChildPath .ssh_tests\private.ppk
          mkdir ~\.ssh_tests
          Set-Content -Value $([System.Convert]::FromBase64String($encodedKey)) -Path $finalPath -AsByteStream
          powershell -command "Start-Process .\vendor\pageant\pageant_${{ matrix.arch }}.exe $finalPath"
          node utils/retry npm test

      - name: Package prebuild
        id: package
        if: always() && steps.install.outcome == 'success' && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' || github.event_name == 'workflow_dispatch') && matrix.node == 22
        run: |
          npm install -g @mapbox/node-pre-gyp
          node lifecycleScripts\clean
          New-Item -ItemType Directory -Force build\prebuild\Release
          Copy-Item build\Release\bungit.node build\prebuild\Release\
          if (Test-Path build\Release\bungit.pdb) {
            Copy-Item build\Release\bungit.pdb build\prebuild\Release\
          }
          npm pkg set binary.module_path=./build/prebuild/Release/
          node-pre-gyp package --target_arch=${{ matrix.arch }}

      - name: Upload prebuild artifact
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-windows-${{ matrix.arch }}
          path: build/stage/**/*.tar.gz

  publish-release:
    name: Publish GitHub Release
    if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '')
    needs: [linux-tests, macos-tests, windows-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all prebuild artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: prebuilds
          merge-multiple: true

      - name: List prebuilds
        run: find prebuilds -type f

      - name: Verify required prebuilds
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for asset in \
            "bungit-v${version}-linux-x64.tar.gz" \
            "bungit-v${version}-linux-arm64.tar.gz" \
            "bungit-v${version}-darwin-x64.tar.gz" \
            "bungit-v${version}-darwin-arm64.tar.gz" \
            "bungit-v${version}-win32-x64.tar.gz" \
            "bungit-v${version}-win32-arm64.tar.gz"
          do
            if ! find prebuilds -type f -name "$asset" -print -quit | grep -q .; then
              echo "Missing required prebuild: $asset" >&2
              exit 1
            fi
          done

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find prebuilds -type f -name '*.tar.gz' -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "No prebuilds were downloaded" >&2
            exit 1
          fi

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
