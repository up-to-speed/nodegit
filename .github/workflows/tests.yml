on:
  push:
    branches:
      - master
      - backport/*
    tags:
      - v*.*.*
  pull_request:
  workflow_dispatch:

name: Testing

jobs:
  linux-tests:
    name: "Linux Tests"
    strategy:
      matrix:
        node: [20, 22, 24]
      fail-fast: false
    runs-on: ubuntu-22.04
    steps:
      - name: Install Dependencies for Ubuntu
        run: sudo apt-get update && sudo apt-get install -y software-properties-common git build-essential clang libssl-dev libkrb5-dev libc++-dev wget zlib1g-dev

      - uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          set -e
          mkdir ~/.ssh_tests
          chmod 700 ~/.ssh_tests
          printf "%b" "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh_tests/config
          cat test/id_rsa.pub > ~/.ssh_tests/id_rsa.pub
          cat test/id_rsa.enc | base64 -d > ~/.ssh_tests/id_rsa
          chmod 600 ~/.ssh_tests/id_rsa*
          git config --global user.name "John Doe"
          git config --global user.email johndoe@example.com

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Install
        id: install
        run: npm install

      - name: Test
        run: |
          set -e
          eval `ssh-agent -s`
          ssh-add ~/.ssh_tests/id_rsa
          node utils/retry npm test

      - name: Package prebuild
        if: always() && steps.install.outcome == 'success' && startsWith(github.ref, 'refs/tags/v') && matrix.node == 22
        run: |
          npm install -g @mapbox/node-pre-gyp
          node lifecycleScripts/clean
          node-pre-gyp package

      - name: Upload prebuild artifact
        if: always() && steps.install.outcome == 'success' && startsWith(github.ref, 'refs/tags/v') && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-linux-x64
          path: build/stage/**/*.tar.gz

  macos-tests:
    name: "macOS Tests"
    strategy:
      matrix:
        node: [20, 22, 24]
        arch: [x64, arm64]
      fail-fast: false
    runs-on: ${{ matrix.arch == 'x64' && 'macos-13' || 'macos-14' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          mkdir ~/.ssh_tests
          chmod 700 ~/.ssh_tests
          printf "%b" "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh_tests/config
          cat test/id_rsa.pub > ~/.ssh_tests/id_rsa.pub
          cat test/id_rsa.enc | base64 -d > ~/.ssh_tests/id_rsa
          chmod 600 ~/.ssh_tests/id_rsa*
          git config --global user.name "John Doe"
          git config --global user.email johndoe@example.com

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Install
        id: install
        run: npm install

      - name: Test
        run: |
          set -e
          eval `ssh-agent -s`
          ssh-add ~/.ssh_tests/id_rsa
          node utils/retry npm test

      - name: Package prebuild
        if: always() && steps.install.outcome == 'success' && startsWith(github.ref, 'refs/tags/v') && matrix.node == 22
        run: |
          npm install -g @mapbox/node-pre-gyp
          node lifecycleScripts/clean
          node-pre-gyp package

      - name: Upload prebuild artifact
        if: always() && steps.install.outcome == 'success' && startsWith(github.ref, 'refs/tags/v') && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-macos-${{ matrix.arch }}
          path: build/stage/**/*.tar.gz

  windows-tests:
    name: Windows Tests
    strategy:
      matrix:
        node: [20, 22, 24]
        arch: [x64, arm64]
      fail-fast: false
    runs-on: windows-2022
    steps:
      - name: Setup Environment
        run: |
          git config --file C:\ProgramData\Git\config core.autocrlf input
          git config --system core.autocrlf input
          git config --global core.autocrlf input
          git config --global user.name "John Doe"
          git config --global user.email johndoe@example.com

      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Install
        id: install
        env:
          npm_config_arch: ${{ matrix.arch }}
        run: npm install

      - name: Test
        # need arm64 runners or an emulator to run tests
        if: matrix.arch != 'arm64'
        env:
          GIT_SSH: ${{ github.workspace }}\vendor\plink.exe
        run: |
          $encodedKey = Get-Content -Path test\private.ppk.enc
          $finalPath = Join-Path -Path $HOME -ChildPath .ssh_tests\private.ppk
          mkdir ~\.ssh_tests
          Set-Content -Value $([System.Convert]::FromBase64String($encodedKey)) -Path $finalPath -AsByteStream
          powershell -command "Start-Process .\vendor\pageant\pageant_${{ matrix.arch }}.exe $finalPath"
          node utils/retry npm test

      - name: Package prebuild
        if: always() && steps.install.outcome == 'success' && startsWith(github.ref, 'refs/tags/v') && matrix.node == 22
        run: |
          npm install -g @mapbox/node-pre-gyp
          node lifecycleScripts\clean
          node-pre-gyp package --target_arch=${{ matrix.arch }}

      - name: Upload prebuild artifact
        if: always() && steps.install.outcome == 'success' && startsWith(github.ref, 'refs/tags/v') && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-windows-${{ matrix.arch }}
          path: build/stage/**/*.tar.gz

  publish-release:
    name: Publish GitHub Release
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: [linux-tests, macos-tests, windows-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all prebuild artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: prebuilds
          merge-multiple: true

      - name: List prebuilds
        run: find prebuilds -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: prebuilds/**/*.tar.gz
          generate_release_notes: true
